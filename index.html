<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roguelike Tetris</title>
    <link rel="stylesheet" href="src/style.css">
<link rel="apple-touch-icon" href="icon192x192.PNG">
<link rel="icon" href="icon192x192.PNG">
<link rel="manifest" href="manifest.json">
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
</script>
</head>
<body>
<div id="dmg-overlay" class="dmg-overlay"></div>

<div id="game-area">
    <div id="battle-stage">
        <div id="enemy-wrapper">
            <div id="enemy-sprite" class="enemy-sprite">
                <div class="enemy-eye left"><div class="enemy-pupil"></div></div>
                <div class="enemy-eye right"><div class="enemy-pupil"></div></div>
            </div>
        </div>
        <div class="enemy-info">
            <div class="enemy-name">ENEMY Lv.<span id="lvl-val">1</span></div>
            <div class="enemy-hp-box"><div id="en-bar"></div></div>
            <div style="font-size:10px; margin-top:2px; color:#aaa;"><span id="en-hp-val">50</span> HP</div>
        </div>
        <div class="enemy-timer-bubble" id="en-timer-bubble">
            ⚔️ <span id="en-timer">5.0</span>s
        </div>
    </div>

    <div id="play-area">
        <div id="canvas-wrapper">
            <canvas id="tetris" width="200" height="360"></canvas>
            
            <div id="overlay">
                <div id="start-ui">
                    <h2 style="color:var(--accent-color); margin:0; text-align:center;">ROGUELIKE<br>TETRIS </h2>
                    <p style="font-size:12px; color:#aaa;">Clear lines to kill enemies.<br>Level up to get skills.</p>
                    <button id="btn-start" class="start-btn">START</button>
                </div>
                
                <div id="game-over-ui" style="display:none; text-align:center;">
                    <h1 style="color:red; margin:10px;">YOU DIED</h1>
                    <p>Level: <span id="res-lvl"></span> | Score: <span id="res-scr"></span></p>
                    <button id="btn-retry" class="start-btn">RETRY</button>
                </div>

                <div id="skill-menu">
                    <h2 style="color:#fff; margin-bottom:10px;">LEVEL UP!</h2>
                    <div id="skill-list"></div>
                </div>
            </div>
        </div>

        <div id="ui-panel">
            <div class="stat-box">
                <div>HP: <b id="hp-val">100</b></div>
                <div class="bar-bg"><div id="hp-bar" class="bar-fill"></div></div>
                <div class="sub-stat"><span>DEF:</span><span id="def-val">0</span></div>
                <div class="sub-stat"><span>VAMP:</span><span id="vamp-val">0</span></div>
                <div class="sub-stat"><span>REG:</span><span id="reg-val">0</span></div>
            </div>
            <div class="stat-box">
                <div>ATK: <b id="atk-val">10</b></div>
                <div class="sub-stat"><span>CRIT:</span><span id="crit-val">0%</span></div>
                <div>Score: <span id="score-val">0</span></div>
            </div>
            <div id="log"></div>
        </div>
    </div>
</div>

<div id="controls-wrapper">
    <div class="btn" id="btn-rot-l">🔄L</div>
    <div class="btn" id="btn-hard" style="font-weight:bold;">▲DROP</div>
    <div class="btn" id="btn-rot-r">🔄R</div>
    <div class="btn" id="btn-left">⬅️</div>
    <div class="btn" id="btn-down">⬇️</div>
    <div class="btn" id="btn-right">➡️</div>
</div>

<script src="src/script.js"></script>
</body>
</html>
